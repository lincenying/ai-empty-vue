# 是否忽略向工作区根目录添加依赖时的警告提示
ignoreWorkspaceRootCheck: true

# 定义了版本发布后 pnpm 安装之前必须经过的最少分钟数
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

# 当设置为“禁止降级”时，如果软件包的信任级别较之前的版本有所降低，pnpm 将无法安装

trustPolicy: off

# 列出一个或多个 pnpm 应该允许安装的特定软件包或版本，即使这些软件包不满足信任策略要求。
trustPolicyExclude:
  - semver
  - chokidar
  - cached-factory

# 用于控制是否严格检查对等依赖（peer dependencies）的版本一致性。
# 当设置为 true 时，pnpm 会强制安装指定版本的对等依赖；
# 设置为 false 时，会忽略版本不一致的警告
strictPeerDependencies: false

registries:
  default: https://registry.npmmirror.com/

# npm 包注册表的基本 URL（包括尾部斜杠）
registry: https://registry.npmmirror.com/
# 是否强制提升所有依赖
shamefullyHoist: true

# 在执行脚本时使用POSIX shell模拟器替代系统原生shell
shellEmulator: true

# 强制 UnoCSS 及相关子包同版本，避免 @lincy/unocss-base-config 嵌套的 66.7
# 与项目 66.8 混用导致 activatedRules / getActivatedRules API 不兼容
overrides:
  '@unocss/core': 66.8.0
  '@unocss/preset-attributify': 66.8.0
  '@unocss/preset-icons': 66.8.0
  '@unocss/preset-mini': 66.8.0
  '@unocss/preset-wind3': 66.8.0
  '@unocss/preset-wind4': 66.8.0
  '@unocss/vite': 66.8.0
  unocss: 66.8.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
